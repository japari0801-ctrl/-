<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>자파리 배포 기록 백업</title><style>body{font-family:system-ui,'Apple SD Gothic Neo',sans-serif;background:#f4f7fb;color:#172033;margin:0;padding:24px}.panel{max-width:520px;background:white;margin:24px auto;padding:24px;border-radius:18px;box-shadow:0 8px 30px #1e293b16}h1{font-size:22px}p{line-height:1.65;color:#42526b}.note{background:#eff6ff;padding:12px;border-radius:10px;font-size:14px}button{width:100%;background:#2563eb;color:#fff;border:0;border-radius:12px;padding:15px;font-weight:700;font-size:17px;margin-top:12px}button:disabled{background:#94a3b8}#status{font-weight:700;white-space:pre-wrap}small{display:block;color:#64748b;margin-top:12px}</style></head><body><main class="panel"><h1>📦 자파리 기존 배포 기록 백업</h1><p>기존 앱에서 사용하던 <b>같은 휴대폰·브라우저·웹사이트 주소</b>에서 실행해 주세요. 이 페이지는 기록을 읽어 다운로드만 하고 기존 내용을 변경하지 않습니다.</p><p class="note">기존 앱에서 배포 기록이 남아 있는지 먼저 확인한 뒤 아래 버튼을 눌러 주세요. 백업 파일은 개인정보와 내부 기관 정보가 포함될 수 있으니 외부에 공유하지 마세요.</p><p id="status">기록 확인 중…</p><button id="download" disabled>기존 배포 기록 JSON 다운로드</button><small>기록이 없다고 나오면 브라우저가 다르거나 원래 앱 주소와 다른 주소에서 실행했을 수 있습니다. 앱 데이터 삭제는 하지 마세요.</small></main><script>
(() => {const el=document.getElementById('status'),btn=document.getElementById('download');const raw=localStorage.getItem('zapari_data_agentic');if(!raw){el.textContent='⚠️ 이 주소의 브라우저 저장소에서 기존 기록을 찾지 못했습니다.';return;}let arr;try{arr=JSON.parse(raw);if(!Array.isArray(arr))throw Error('배열 형식이 아닙니다');}catch(e){el.textContent='⚠️ 저장 데이터 형식을 읽지 못했습니다. 내용을 삭제하지 마세요.';return;}const counts={};arr.forEach(a=>counts[a.status||'대기']=(counts[a.status||'대기']||0)+1);el.textContent=`✅ 기존 저장 기록 발견\n전체 ${arr.length}곳 / 완료 ${counts['완료']||0}곳 / 배포중 ${counts['배포중']||0}곳 / 대기 ${counts['대기']||0}곳`;btn.disabled=false;btn.addEventListener('click',()=>{const data=JSON.stringify({exportedAt:new Date().toISOString(),sourceOrigin:location.origin,key:'zapari_data_agentic',items:arr},null,2);const blob=new Blob([data],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='자파리_기존배포기록_백업.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);});})();
</script></body></html>
